repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Rust: formatting, all-targets linting, test pre-push gate, and Org doc dogfooding
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

      # org-tools: lint and check formatting on docs/ and README.org
      - id: org-fmt
        name: org fmt check
        entry: cargo run --quiet -- fmt check
        language: system
        files: ^(docs/.*\.org|README\.org)$
        types_or: [file]
