[tools]
rust = "stable"

[tasks.setup]
description = "Fetch locked Cargo workspace dependencies deterministically"
run = "cargo fetch --locked"

[tasks.fmt]
description = "Format Rust sources and Org documentation"
run = "cargo fmt && cargo run --quiet -- fmt format README.org docs/"

[tasks.lint]
description = "Check Rust formatting, run all-targets Clippy, and lint Org docs"
run = "cargo fmt -- --check && cargo clippy --all-targets -- -D warnings && cargo run --quiet -- fmt check README.org docs/"

[tasks.test]
description = "Run all unit and integration test suites"
run = "cargo test"

[tasks.verify]
description = "Run combined formatting, Clippy, test, and Org documentation self-dogfood gates"
run = "cargo fmt -- --check && cargo clippy --all-targets -- -D warnings && cargo test && cargo run --quiet -- fmt check README.org docs/"

[tasks.docs]
description = "Validate repository README.org and docs/ with org fmt check"
run = "cargo run --quiet -- fmt check README.org docs/"

[tasks.bench]
description = "Compile workspace benchmark and release targets"
run = "cargo bench --no-run"

[tasks.metrics]
description = "Render OpenMetrics and Prometheus telemetry from local ledger"
run = "mkdir -p .cache/telemetry && cargo run --quiet -- fmt check --format json README.org docs/ >/dev/null"

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks.install]
description = "Install the org binary into local PATH"
run = "cargo install --locked --path crates/org"

[tasks.dev]
description = "Build in debug mode and run"
run = "cargo run --"

[tasks.check]
description = "Run org-tools check on edge case fixtures"
run = "cargo run -- fmt check tests/fixtures/edge_cases/"

[tasks."demo:setup"]
description = "Set up a demo environment with sample org files"
run = "bash scripts/setup-demo.sh"

[tasks.release]
description = "Bump version, commit, tag, and push to trigger release"
run = "bash scripts/release.sh {{arg(name='version', default='')}}"
