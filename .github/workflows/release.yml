#
# Multi-target GoReleaser v2 release pipeline, decoupled optional crates.io
# publish gate, and Uhrenmaschine Prometheus/JSONL release verification.

name: Release

# region Triggers & Permissions
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      snapshot_note:
        description: "Optional operator note for snapshot dry-run verification"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write
# endregion

# region Environment & Observability Defaults
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  ORGFMT_GORELEASER_VERSION: "${{ vars.ORGFMT_GORELEASER_VERSION || 'v2.18.0' }}"
  ORGFMT_CONTAINER_IMAGE: "${{ vars.ORGFMT_CONTAINER_IMAGE || format('ghcr.io/{0}', github.repository) }}"
  ORGFMT_RELEASE_METRICS_FILE: "${{ vars.ORGFMT_RELEASE_METRICS_FILE || 'dist/telemetry/release-metrics.prom' }}"
  ORGFMT_RELEASE_EVENTS_FILE: "${{ vars.ORGFMT_RELEASE_EVENTS_FILE || 'dist/telemetry/release-events.jsonl' }}"
  FRITZ_TRACE_ID: "${{ vars.FRITZ_TRACE_ID || github.run_id }}"
# endregion

jobs:
  # region Validate Job
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy lints
        run: |
          cargo clippy -p org-tools --all-targets -- -D warnings
          cargo clippy -- -D warnings

      - name: Run test suite
        run: cargo test --verbose

      - name: Check operations documentation formatting
        run: cargo run --release -- fmt check docs/operations/installation.org docs/operations/homebrew-tap.org

      - name: Smoke test on edge case fixtures
        run: |
          # Exit 1 = diagnostics found (expected for edge case fixtures).
          # Exit 2+ = operational error (unexpected).
          cargo run --release -- fmt check tests/fixtures/edge_cases/ || [ $? -eq 1 ]

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          WORKSPACE_RAW="$(sed -n '/\[workspace\.package\]/,/^\[/{ s/^version *= *"\(.*\)"/\1/p }' Cargo.toml)"
          CLI_DEP_RAW="$(sed -n 's/^org-tools-core *=.*version *= *"\([^"]*\)".*/\1/p' crates/org/Cargo.toml)"
          CARGO_VERSION="v${WORKSPACE_RAW}"
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$WORKSPACE_RAW" != "$CLI_DEP_RAW" ]; then
            echo "::error::Cargo.toml ($WORKSPACE_RAW) and crates/org/Cargo.toml ($CLI_DEP_RAW) are out of sync"
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$GIT_TAG" ]; then
            echo "::error::Tag $GIT_TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "Version verified: $GIT_TAG"
  # endregion

  # region Release Packages Job
  release-packages:
    name: Build & publish multi-arch packages
    runs-on: macos-latest
    needs: validate
    steps:
      - name: Checkout full git history for GoReleaser
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable with all 6 release targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Cache Cargo cross-compilation artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Zig toolchain for static musl linking
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cargo-xwin

      - name: Run GoReleaser multi-target build and package pipeline
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> ${{ env.ORGFMT_GORELEASER_VERSION }}"
          args: "${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --snapshot --clean' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Verify release packages and append telemetry summary
        run: |
          SUMMARY_JSON="$(bash scripts/verify-release-packages.sh --dist-dir dist)"
          echo "$SUMMARY_JSON"
          {
            echo "## Release Package Verification Summary"
            if [ -n "${SNAPSHOT_NOTE:-}" ]; then
              echo ""
              echo "Snapshot note: \`${SNAPSHOT_NOTE}\`"
            fi
            echo ""
            echo '```json'
            echo "$SUMMARY_JSON"
            echo '```'
            echo ""
            echo "### Prometheus Release Metrics"
            echo ""
            echo '```prometheus'
            cat "$ORGFMT_RELEASE_METRICS_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SNAPSHOT_NOTE: ${{ inputs.snapshot_note }}

      - name: Upload release Prometheus metrics and JSONL telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-telemetry
          path: |
            ${{ env.ORGFMT_RELEASE_METRICS_FILE }}
            ${{ env.ORGFMT_RELEASE_EVENTS_FILE }}
          if-no-files-found: warn
  # endregion

  # region Crates.io Publish Gate Job
  publish-crates:
    name: Publish crates to crates.io (optional gate)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build state
        uses: Swatinem/rust-cache@v2

      - name: Publish org-tools-core and org-tools when token is configured
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."
            exit 0
          fi
          if [[ "${GITHUB_REF:-}" != refs/tags/v* ]]; then
            echo "::notice::Non-tag ref (${GITHUB_REF:-unknown}); skipping live crates.io publish during snapshot dry-run."
            exit 0
          fi
          cargo publish -p org-tools-core
          cargo publish -p org-tools
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  # endregion

  # region Container Publish Job
  publish-container:
    name: Build & publish GHCR container image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata and tags for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ORGFMT_CONTAINER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # endregion
