repos:
  # Rust: formatting, all-targets linting, and Org documentation dogfooding
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # org-tools: lint and check formatting on docs/ and README.org
      - id: org-fmt
        name: org fmt check
        entry: cargo run --quiet -- fmt check
        language: system
        files: ^(docs/.*\.org|README\.org)$
        types_or: [file]
